<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jess's ARFID Recipes</title>
<meta name="theme-color" content="#FF9BBB">
<meta name="description" content="Safe foods, scaled to any amount.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Pastel kawaii recipe box: sticker-style cards with chunky outlines on a blush polka-dot page; one column, phone first */
  --bg: #FFF3F6;
  --paper: #FFFFFF;
  --ink: #4A2C3A;
  --soft: #8C6A7A;
  --pink: #FF9BBB;
  --pink-deep: #E8578A;
  --butter: #FFE7A0;
  --mint: #B6F0DC;
  --lilac: #DCD0FF;
  --peach: #FFD6C0;
  --line: #F4D2DE;
  --display: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle, #FFE1EA 2.2px, transparent 2.6px);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }

.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 64px; }
.kit { padding: 16px; margin-top: 18px; display: grid; gap: 10px; }
.kit h3 { font-size: 18px; font-weight: 600; }
.kit .btns { display: grid; gap: 10px; }
.kit .btn { justify-content: flex-start; }
.codebox { width: 100%; min-height: 120px; border: 2px solid var(--ink); border-radius: 12px; padding: 10px; font-size: 14px; resize: vertical; text-align: left; }
.dialog.wide { max-width: 420px; width: 100%; text-align: left; }

/* ---------- Sticker basics ---------- */
.sticker {
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 22px;
  box-shadow: 0 4px 0 var(--ink);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 2.5px solid var(--ink); border-radius: 999px;
  background: var(--paper); box-shadow: 0 3px 0 var(--ink);
  padding: 8px 16px; font-family: var(--display); font-weight: 600; font-size: 15px;
  transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.pink { background: var(--pink); }
.btn.mint { background: var(--mint); }
.btn.small { padding: 5px 12px; font-size: 14px; }
.btn.ghost { box-shadow: none; border-style: dashed; background: transparent; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* ---------- Home ---------- */
.home-head { display: grid; gap: 6px; padding: 12px 4px 20px; text-align: center; justify-items: center; }
.home-head .crew { display: flex; align-items: flex-end; gap: 4px; height: 76px; }
.home-head .crew > div { animation: bob 2.4s ease-in-out infinite; }
.home-head .crew > div:nth-child(2) { animation-delay: -.8s; }
.home-head .crew > div:nth-child(3) { animation-delay: -1.6s; }
.home-head h1 { font-size: 34px; font-weight: 700; color: var(--pink-deep); letter-spacing: .3px; }
.home-head p { margin: 0; color: var(--soft); font-weight: 700; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rcard {
  display: grid; grid-template-rows: auto 1fr; text-align: left; padding: 0; overflow: hidden;
  border: 2.5px solid var(--ink); border-radius: 22px; background: var(--paper);
  box-shadow: 0 4px 0 var(--ink); transition: transform .12s, box-shadow .12s;
}
.rcard:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.rcard .art { display: grid; place-items: center; height: 120px; border-bottom: 2.5px solid var(--ink); }
.rcard .art > div { width: 104px; animation: bob 2.2s ease-in-out infinite; }
.rcard .meta { padding: 10px 12px 12px; display: grid; gap: 2px; align-content: start; }
.rcard h3 { font-size: 18px; font-weight: 600; }
.rcard .sub { font-size: 13px; color: var(--soft); font-weight: 700; }
.addcard {
  display: grid; place-items: center; gap: 6px; min-height: 190px; padding: 12px;
  border: 2.5px dashed var(--ink); border-radius: 22px; background: rgba(255,255,255,.6);
  font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--ink);
}
.addcard .plus { width: 48px; height: 48px; border-radius: 50%; background: var(--butter); border: 2.5px solid var(--ink); display: grid; place-items: center; font-size: 28px; line-height: 1; }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty p { margin: 0; color: var(--soft); font-weight: 700; }

/* ---------- Recipe view ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.topbar .right { display: flex; gap: 8px; flex-wrap: wrap; }
.wake.on { background: var(--mint); }

.hero {
  position: relative; overflow: hidden; height: 200px;
  border: 2.5px solid var(--ink); border-radius: 26px; box-shadow: 0 4px 0 var(--ink);
}
.hero .bits { position: absolute; inset: 0; pointer-events: none; }
.bit { position: absolute; bottom: -24px; width: 18px; animation: floatUp linear infinite; opacity: 0; }
.parade { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; align-items: flex-end; gap: 2px; }
.dancer { border: 0; background: none; padding: 0; animation: hop .9s ease-in-out infinite alternate; transform-origin: 50% 100%; position: relative; }
.dancer svg { display: block; width: 100%; height: auto; }
.dancer.spin { animation: spin .7s ease-in-out; }
.yum {
  position: absolute; left: 50%; top: -18px; transform: translateX(-50%);
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px;
  font-family: var(--display); font-weight: 700; font-size: 13px; white-space: nowrap;
  animation: pop .9s ease-out forwards;
}
.rtitle { padding: 18px 4px 6px; display: grid; gap: 4px; }
.rtitle h2 { font-size: 30px; font-weight: 700; }

.scaler { padding: 16px; margin-top: 10px; display: grid; gap: 12px; background: var(--butter); }
.scaler .q { font-family: var(--display); font-weight: 600; font-size: 18px; }
.sc-row { display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; align-items: center; }
.sc-row .round {
  width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper);
  box-shadow: 0 3px 0 var(--ink); font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1;
}
.sc-row .round:active { transform: translateY(3px); box-shadow: none; }
.sc-val { display: flex; align-items: baseline; justify-content: center; gap: 6px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 18px; padding: 4px 10px; }
.sc-val input {
  width: 100%; min-width: 0; max-width: 150px; border: 0; background: transparent; text-align: right;
  font-family: var(--display); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; padding: 0;
}
.sc-val input:focus { outline: none; }
.sc-val .unit { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--soft); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chip {
  flex: none; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); padding: 4px 12px;
  font-family: var(--display); font-weight: 600; font-size: 15px;
}
.chip.active { background: var(--pink); }
.chip .star { color: var(--pink-deep); }
.chip.active .star { color: var(--ink); }
.sc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 32px; }
.sc-foot .msg { font-size: 14px; font-weight: 700; color: var(--ink); }

.tabs {
  position: sticky; top: 8px; z-index: 5; margin: 18px 0 14px; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px; box-shadow: 0 3px 0 var(--ink);
}
.tab { border: 0; background: transparent; border-radius: 999px; padding: 8px 4px; font-family: var(--display); font-weight: 600; font-size: 16px; }
.tab[aria-selected="true"] { background: var(--pink); }

.list { display: grid; gap: 10px; }
.ing { padding: 12px 14px; display: grid; gap: 2px; }
.ing .line { font-size: 17px; }
.ing .amt { font-family: var(--display); font-weight: 700; color: var(--pink-deep); font-size: 19px; margin-right: 4px; }
.ing .nm { font-weight: 800; }
.ing .note { font-size: 14px; color: var(--soft); font-weight: 700; }
.ing .was { justify-self: start; margin-top: 4px; font-size: 12px; font-weight: 800; background: var(--lilac); border-radius: 999px; padding: 1px 9px; }
.ing.anchor { background: #FFF8E2; }

.step { padding: 14px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.step .num {
  width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--ink); display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 20px; background: var(--mint);
}
.step:nth-child(3n+2) .num { background: var(--pink); }
.step:nth-child(3n+3) .num { background: var(--butter); }
.step h3 { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
.step p { margin: 0; }
.tok { color: var(--pink-deep); font-weight: 800; }

.notes { padding: 14px; display: grid; gap: 8px; }
.notes textarea {
  width: 100%; min-height: 200px; resize: vertical; border: 2px dashed var(--line); border-radius: 14px; padding: 12px;
  background: #FFFBFD; line-height: 1.5;
}
.notes textarea:focus { outline: none; border-color: var(--pink); }
.notes .status { font-size: 13px; font-weight: 800; color: var(--soft); min-height: 20px; }
.hint { font-size: 14px; color: var(--soft); font-weight: 700; margin: 0; }

/* ---------- Editor ---------- */
.editor { display: grid; gap: 16px; }
.panel { padding: 16px; display: grid; gap: 12px; }
.panel h3 { font-size: 20px; font-weight: 600; }
label.f { display: grid; gap: 4px; font-weight: 800; font-size: 14px; }
.inp, .sel, .ta {
  width: 100%; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); padding: 8px 10px; font-size: 16px;
}
.ta { min-height: 76px; resize: vertical; }
.pick { display: flex; gap: 8px; flex-wrap: wrap; }
.pick button { width: 68px; height: 62px; border: 2.5px solid var(--line); border-radius: 16px; background: var(--paper); padding: 4px; display: grid; place-items: center; }
.pick button[aria-pressed="true"] { border-color: var(--ink); background: var(--butter); box-shadow: 0 3px 0 var(--ink); }
.pick button svg { width: 54px; height: auto; }
.swatch { width: 40px !important; height: 40px !important; border-radius: 50% !important; }
.erow { border: 2px solid var(--line); border-radius: 16px; padding: 10px; display: grid; gap: 8px; background: #FFFBFD; }
.erow .r1 { display: grid; grid-template-columns: 76px 96px 1fr; gap: 8px; }
.erow .r2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.erow .tools { display: flex; gap: 6px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); display: grid; place-items: center; font-weight: 800; line-height: 1; padding: 0; }
.radio { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
.radio input { width: 18px; height: 18px; accent-color: var(--pink-deep); }
.save-bar { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.err { color: #B4234F; font-weight: 800; margin: 0; }
@media (max-width: 420px) {
  .erow .r1 { grid-template-columns: 1fr 1fr; }
  .erow .r1 .nmcell { grid-column: 1 / -1; }
  .rcard .art { height: 104px; }
  .rcard .art > div { width: 92px; }
}

/* ---------- Overlay + toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(74,44,58,.35); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { padding: 20px; max-width: 360px; display: grid; gap: 14px; text-align: center; }
.dialog .row { display: flex; gap: 10px; justify-content: center; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px);
  background: var(--ink); color: #fff; border-radius: 16px; padding: 10px 16px; font-weight: 800; font-size: 14px; text-align: center;
}
.loading { text-align: center; padding: 60px 16px; display: grid; gap: 12px; justify-items: center; color: var(--soft); font-weight: 800; }
.loading > div { width: 96px; animation: hop .6s ease-in-out infinite alternate; }

/* ---------- Mascot animation ---------- */
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.steam { animation: steam 2.4s ease-in-out infinite; }
.steam.s2 { animation-delay: -1.2s; }

@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
@keyframes hop { 0% { transform: translateY(0) rotate(-7deg) scaleY(.96); } 100% { transform: translateY(-16px) rotate(7deg) scaleY(1.03); } }
@keyframes spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.6); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -26px) scale(1); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
@keyframes steam { 0%, 100% { opacity: .2; transform: translateY(4px); } 50% { opacity: .9; transform: translateY(-4px); } }
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0); opacity: 0; }
  12% { opacity: .95; }
  85% { opacity: .95; }
  100% { transform: translateY(-250px) rotate(320deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .bit { display: none; }
}
</style>
</head>

<script>
(function () {

        '<rect x="6" y="52" width="16" height="12" rx="6" fill="#9FDCC7"/><rect x="118" y="52" width="16" height="12" rx="6" fill="#9FDCC7"/>' +
        '<rect x="18" y="42" width="104" height="62" rx="16" fill="#B6F0DC"/>' +
        '<path d="M14 42 Q70 18 126 42 Z" fill="#9FDCC7"/>' +
        '<rect x="62" y="22" width="16" height="10" rx="5" fill="#FF9BBB"/>' +
        '</g>' + face(70, 74, 1) + '</svg>';
    },
    bits: ["heart", "sparkle", "dot"]
  },
  saucepan: {
    label: "Saucepan",
    svg: function () {

function requestWake() {
  if (!("wakeLock" in navigator)) return Promise.reject(new Error("unsupported"));
  return navigator.wakeLock.request("screen").then(function (w) {
    S.wake = w;
    w.addEventListener("release", function () { S.wake = null; });
  });
}
function stopWake() {
  S.wantWake = false;
  if (S.wake) { try { S.wake.release(); } catch (e) {} S.wake = null; }
}
function toggleWake() {
  if (S.wantWake) { stopWake(); updateWakeBtn(); return; }
  requestWake().then(function () {
    S.wantWake = true; updateWakeBtn(); toast("Your screen will stay on while this recipe is open");
  }, function () {
    toast("Your phone didn't let the screen stay on this time. Try again in a moment.");
  });
}
function updateWakeBtn() {
  var b = document.querySelector('[data-act="wake"]');

/* ================= Recipe codes ================= */
function cleanRecipe(o) {
  if (!o || typeof o !== "object" || typeof o.name !== "string" || !o.name.trim() || !Array.isArray(o.ingredients) || !o.ingredients.length) return null;
  var ings = [];
  for (var i = 0; i < o.ingredients.length; i++) {
    var g = o.ingredients[i] || {};
    var unit = UNITS.indexOf(g.unit) >= 0 ? g.unit : "whole";
    var amt = Number(g.amount);
    if (typeof g.name !== "string" || !g.name.trim()) return null;
    if (unit !== "to taste" && !(amt > 0)) return null;
    var row = { name: g.name.trim(), amount: unit === "to taste" ? 0 : amt, unit: unit };
    if (typeof g.note === "string" && g.note.trim()) row.note = g.note.trim();
    ings.push(row);
  }
  var anchor = typeof o.anchor === "number" && ings[o.anchor] && ings[o.anchor].unit !== "to taste" ? o.anchor : 0;
  if (ings[anchor].unit === "to taste") return null;
  var steps = (Array.isArray(o.steps) ? o.steps : []).map(function (s) {
    return { title: String((s && s.title) || "").trim(), text: String((s && s.text) || "").trim() };
  }).filter(function (s) { return s.title || s.text; });
  return {
    id: typeof o.id === "string" && /^[a-z0-9-]{1,60}$/.test(o.id) ? o.id : "",
    name: o.name.trim(), subtitle: typeof o.subtitle === "string" ? o.subtitle.trim() : "",
    mascot: MASCOTS[o.mascot] ? o.mascot : "pot", color: TINTS[o.color] ? o.color : "pink",
    anchor: anchor, ingredients: ings, steps: steps
  };
}
function encodeCode(r) {
  var o = { id: r.id, name: r.name, subtitle: r.subtitle || "", mascot: r.mascot, color: r.color, anchor: anchorOf(r).idx, ingredients: r.ingredients, steps: r.steps };
  return "JAR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function decodeCode(text) {
  var s = String(text || "").trim();
  var k = s.indexOf("JAR1:");
  try {
    if (k >= 0) return JSON.parse(decodeURIComponent(escape(atob(s.slice(k + 5).replace(/[^A-Za-z0-9+/=]/g, "")))));
    if (s.charAt(0) === "{") return JSON.parse(s);
  } catch (e) {}
  return null;
}
function openCodeDialog() {
  layer.innerHTML = '<div class="overlay" data-close><div class="sticker dialog wide" role="dialog" aria-modal="true" aria-labelledby="code-t">' +
    '<h3 id="code-t" style="font-size:20px">Add from a recipe code</h3>' +
    '<p class="hint" style="margin:0">Paste the code Claude gave you. It starts with JAR1. If you already have that recipe, it gets updated and your notes are kept.</p>' +
    '<textarea class="codebox" id="code-in" aria-label="Recipe code" placeholder="JAR1:…"></textarea>' +
    '<p class="err" id="code-err" role="alert"></p>' +
    '<div class="row"><button class="btn" data-act="dlg-cancel">Cancel</button><button class="btn pink" data-act="dlg-addcode">Add recipe</button></div></div></div>';
  var t = document.getElementById("code-in"); if (t) t.focus();
}
function addFromCode() {
  var t = document.getElementById("code-in"), err = document.getElementById("code-err");
  var r = cleanRecipe(decodeCode(t && t.value));
  if (!r) { if (err) err.textContent = "That code didn't work. Copy the whole code from the chat, including JAR1:, and try again."; return; }
  var id = r.id || slugify(r.name), old = findRecipe(id);
  if (old) {
    var keepNotes = old.notes || "", keepOrder = old.order;
    if (anchorOf(old).ing.amount !== r.ingredients[r.anchor].amount) { delete S.amounts[id]; lsSet("amt:" + id, ""); }
    for (var k in r) old[k] = r[k];
    old.id = id; old.notes = keepNotes; old.order = keepOrder; old.updatedAt = Date.now();
  } else {
    r.id = id; r.notes = ""; r.order = Date.now(); r.updatedAt = Date.now();
    S.recipes.push(r);
  }
  if (!saveStore()) return;
  layer.innerHTML = "";
  toast(old ? r.name + " updated" : r.name + " added");
  go("recipe-" + id);
}
function copyCode() {
  var r = S.draft && findRecipe(S.draft.id);
  if (!r) return;
  var code = encodeCode(r);
  var done = function () { toast("Recipe code copied. Paste it into your chat with Claude."); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done, function () { showCode(code); });
  } else showCode(code);
}
function showCode(code) {
  layer.innerHTML = '<div class="overlay" data-close><div class="sticker dialog wide" role="dialog" aria-modal="true" aria-labelledby="sc-t">' +
    '<h3 id="sc-t" style="font-size:20px">Recipe code</h3><p class="hint" style="margin:0">Press and hold to select it all, then copy.</p>' +
    '<textarea class="codebox" readonly aria-label="Recipe code">' + esc(code) + '</textarea>' +
    '<div class="row"><button class="btn" data-act="dlg-cancel">Done</button></div></div></div>';
}

/* ================= Backups ================= */
function shareOrDownload(blob, name, title) {
  var file;
  try { file = new File([blob], name, { type: blob.type }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    return navigator.share({ files: [file], title: title }).then(function () { return "shared"; }, function (e) {
      return e && e.name === "AbortError" ? "cancelled" : download();
    });
  }
  return Promise.resolve(download());
  function download() {
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      return "downloaded";
    } catch (e) { return "failed"; }
  }
}
function doBackup() {
  var d = new Date();
  var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  var body = JSON.stringify({ app: "jess-arfid-recipes", version: 1, exportedAt: d.toISOString(), recipes: S.recipes }, null, 1);
  var blob = new Blob([body], { type: "text/plain" });
  shareOrDownload(blob, "arfid-recipes-backup-" + stamp + ".txt", "ARFID recipes backup").then(function (how) {
    if (how === "cancelled") return;
    if (how === "failed") { toast("The backup couldn't be made. Try again."); return; }
    lsSet(BACKUP_KEY, String(Date.now()));
    toast(how === "shared" ? "Backup sent. Check it landed in Google Drive." : "Backup saved to your Downloads. Upload it to Google Drive to keep it safe.");
    if (S.view === "home") render();
  });
}
var pendingRestore = null;
function pickRestore() { var f = document.getElementById("restore-file"); if (f) { f.value = ""; f.click(); } }
function readRestore(file) {
  var fr = new FileReader();
  fr.onload = function () {
    var o = null;
    try { o = JSON.parse(String(fr.result)); } catch (e) {}
    var list = o && Array.isArray(o.recipes) ? o.recipes : null, out = [];
    if (list) list.forEach(function (x) {
      var c = cleanRecipe(x);
      if (c) { c.id = c.id || slugify(c.name); c.notes = typeof x.notes === "string" ? x.notes : ""; c.order = Number(x.order) || Date.now(); out.push(c); }
    });
    if (!out.length) { toast("That file isn't a recipe backup. Pick a file named arfid-recipes-backup."); return; }
    pendingRestore = out;
    layer.innerHTML = '<div class="overlay" data-close><div class="sticker dialog" role="dialog" aria-modal="true" aria-labelledby="rs-t">' +
      '<h3 id="rs-t" style="font-size:20px">Restore ' + out.length + ' recipe' + (out.length === 1 ? "" : "s") + '?</h3>' +
      '<p class="hint" style="margin:0">This replaces the recipes and notes on this phone with the ones in the backup.</p>' +
      '<div class="row"><button class="btn" data-act="dlg-cancel">Cancel</button><button class="btn pink" data-act="dlg-restore">Restore</button></div></div></div>';
  };
  fr.readAsText(file);
}
function doRestore() {
  if (!pendingRestore) return;
  S.recipes = pendingRestore; pendingRestore = null; S.amounts = {};
  layer.innerHTML = "";
  if (saveStore()) { toast("Backup restored"); go(""); }
}

/* ================= Start ================= */
function start() {
  var saved = loadStore();
  if (saved) S.recipes = saved;
  else { S.recipes = JSON.parse(JSON.stringify(STARTERS)); saveStore(); }
  S.loaded = true;
  route();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
}
app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var a = t.getAttribute("data-act");
  if (a === "code") openCodeDialog();
  else if (a === "backup") doBackup();
  else if (a === "restore") pickRestore();
  else if (a === "copycode") copyCode();
});
app.addEventListener("change", function (e) {
  if (e.target.id === "restore-file" && e.target.files && e.target.files[0]) readRestore(e.target.files[0]);
});
start();
})();
</script>
